<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Gallery - Efex Luxury</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;family=Montserrat:wght@300;400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#D4AF37",
                        "primary-dark": "#B59230",
                        "primary-light": "#F3D98B",
                        "background-light": "#ffffff",
                        "background-dark": "#0a0a0a",
                        "background-card": "#121212",
                        "text-main": "#FFFFFF",
                        "text-muted": "#A1A1AA",
                    },
                    fontFamily: {
                        "display": ["Playfair Display", "serif"],
                        "body": ["Montserrat", "sans-serif"],
                        "sans": ["Spline Sans", "sans-serif"],
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "2rem", "full": "9999px" },
                },
            },
        }
    </script>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body class="bg-background-dark text-white font-body antialiased selection:bg-primary selection:text-black">
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
        <div id="header-container"></div>
        <main class="pt-24 pb-12">
            <div class="max-w-[1440px] mx-auto px-6 lg:px-12 w-full">
                <div class="text-center my-16">
                    <h1 class="font-display text-5xl md:text-7xl font-bold text-white mb-4">Gallery</h1>
                    <p class="text-text-muted text-lg max-w-xl mx-auto font-light">A curated collection of our finest
                        work and inspirations.</p>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                    <div class="group relative overflow-hidden rounded-lg">
                        <img src="https://picsum.photos/seed/fashion1/600/800" alt="Fashion item 1"
                            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" />
                        <div class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-colors"></div>
                    </div>
                    <div class="group relative overflow-hidden rounded-lg">
                        <img src="https://picsum.photos/seed/fashion2/600/800" alt="Fashion item 2"
                            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" />
                        <div class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-colors"></div>
                    </div>
                    <div class="group relative overflow-hidden rounded-lg">
                        <img src="https://picsum.photos/seed/fashion3/600/800" alt="Fashion item 3"
                            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" />
                        <div class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-colors"></div>
                    </div>
                    <div class="group relative overflow-hidden rounded-lg">
                        <img src="https://picsum.photos/seed/fashion4/600/800" alt="Fashion item 4"
                            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" />
                        <div class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-colors"></div>
                    </div>
                    <div class="group relative overflow-hidden rounded-lg">
                        <img src="https://picsum.photos/seed/fashion5/600/800" alt="Fashion item 5"
                            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" />
                        <div class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-colors"></div>
                    </div>
                    <div class="group relative overflow-hidden rounded-lg">
                        <img src="https://picsum.photos/seed/fashion6/600/800" alt="Fashion item 6"
                            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" />
                        <div class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-colors"></div>
                    </div>
                    <div class="group relative overflow-hidden rounded-lg">
                        <img src="https://picsum.photos/seed/fashion7/600/800" alt="Fashion item 7"
                            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" />
                        <div class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-colors"></div>
                    </div>
                    <div class="group relative overflow-hidden rounded-lg">
                        <img src="https://picsum.photos/seed/fashion8/600/800" alt="Fashion item 8"
                            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" />
                        <div class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-colors"></div>
                    </div>
                </div>
            </div>
        </main>
        <div id="footer-container"></div>
    </div>
    <script src="./js/layout.js"></script>
</body>

</html>
